<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLY 3D Viewer</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        #viewer {
            width: 100vw;
            height: 100vh;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 300px;
        }

        #progress-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            display: none;
        }

        /* Rotate the chevron 180 degrees when the panel is collapsed */
        #btnCollapse.collapsed i {
            display: inline-block;
            transform: rotate(180deg);
        }

        /* Smooth transition for the rotation */
        #btnCollapse i {
            transition: transform 0.3s ease;
        }

        /* Optional: Subtle hover effect for the header icons */
        .ui-panel .btn-outline-light:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #progress-bar {
            width: 0%;
            transition: width 0.3s ease-out; /* Smooths out the jumps */
            background-color: #0d6efd;
        }

        /* --- Menu & Submenu Logic --- */

        /* 1. Hide submenus by default */
        .dropdown-submenu .dropdown-menu {
            display: none;
        }

        /* 2. Standardize the Category (Parent) Link */
        .dropdown-submenu > .dropdown-toggle {
            display: block;
            width: 100%;
        }

            /* 3. The Arrow (Chevron) */
            .dropdown-submenu > .dropdown-toggle::after {
                display: inline-block;
                float: right; /* Keeps arrow on the right edge */
                margin-top: 0.7em; /* Vertical alignment */
                vertical-align: middle;
                content: "";
                /* Create a right-pointing triangle */
                border-top: 0.3em solid transparent;
                border-bottom: 0.3em solid transparent;
                border-left: 0.3em solid;
                /* Smooth rotation transition */
                transition: transform 0.2s ease-in-out;
            }

        /* 4. Rotate the arrow 90deg (pointing down) when the menu is open */
        .dropdown-submenu.show-mobile > .dropdown-toggle::after {
            transform: rotate(90deg);
        }

        /* 5. Unified toggle class for Mobile (Vertical stacking) */
        .dropdown-submenu.show-mobile > .dropdown-menu {
            display: block;
            position: static;
            width: 100%;
            border: none;
            padding-left: 1.5rem; /* Indent sub-items */
            background-color: rgba(255, 255, 255, 0.05); /* Slight tint for hierarchy */
        }

        /* 6. Active State for selected scenes */
        .dropdown-item.active {
            background-color: #0d6efd !important;
            color: white !important;
        }

        /* 7. Desktop override: Fly-out to the right on large screens */
        @media (min-width: 768px) {
            .dropdown-submenu.show-mobile > .dropdown-menu {
                position: absolute;
                left: 100%;
                top: 0;
                width: auto;
                padding-left: 0;
                background-color: #343a40; /* Match Bootstrap dark menu */
                border: 1px solid rgba(255,255,255,0.15);
                box-shadow: 4px 4px 10px rgba(0,0,0,0.5); /* Shadow for depth on desktop */
            }
        }

        /* Custom Transparency for the Modal */
        .modal-content {
            background-color: rgba(255, 255, 255, 0.55); /* Slightly transparent white */
            backdrop-filter: blur(5px); /* Optional: adds a nice frosted glass effect */
            border: none;
            border-radius: 15px;
        }   
    </style>
</head>
<body>

    <div class="ui-panel" style="position: absolute; top: 20px; left: 20px; z-index: 1000; width: 390px;">
        <div class="card bg-dark bg-opacity-75 text-white border-secondary">

            <div class="card-header border-secondary d-flex align-items-center justify-content-between py-2 px-3">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle btn-sm" type="button" data-bs-toggle="dropdown" id="sceneButton">
                        Scene
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark" id="sceneList"></ul>
                </div>

                <div class="d-flex align-items-center gap-1">
                    <button class="btn btn-outline-light btn-sm border-0" id="btnResetCamera" title="Reset Camera (R key)">
                        <i class="bi bi-camera-video"></i>
                    </button>

                    <div id="stepControls" class="d-none d-inline-flex btn-group border border-secondary rounded mx-1">
                        <button class="btn btn-outline-info btn-sm border-0" id="btnStepBack" title="Step Back (left arrow key)">
                            <i class="bi bi-chevron-left"></i>
                        </button>

                        <div class="vr bg-secondary my-1"></div>

                        <button class="btn btn-outline-info btn-sm border-0" id="btnStepForward" title="Step Forward (right arrow key)">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>

                    <button class="btn btn-outline-light btn-sm border-0" id="btnPause" title="Pause/Resume Animation (space key)">
                        <i class="bi bi-pause-fill" id="pauseIcon"></i>
                    </button>

                    <button class="btn btn-sm text-secondary ms-1 p-0" type="button"
                            data-bs-toggle="collapse" data-bs-target="#panelControls"
                            aria-expanded="true" id="btnCollapse">
                        <i class="bi bi-chevron-up" id="collapseIcon"></i>
                    </button>
                </div>
            </div>

            <div class="collapse show" id="panelControls">
                <div class="card-body p-3">
                    <div class="row gx-3 ">
                        <div class="col-6 border-end border-secondary">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="showGridSwitch" checked>
                                <label class="form-check-label small" for="showGridSwitch">Show Grid</label>
                            </div>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="showWireSwitch">
                                <label class="form-check-label small" for="showWireSwitch">Wireframe</label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="autoRotateSwitch">
                                <label class="form-check-label small" for="autoRotateSwitch">Auto-Rotate</label>
                            </div>

                            <label for="rotateSpeedRange" class="form-label small mb-1">Rot Speed: <span id="rotSpeedVal">1</span></label>
                            <input type="range" class="form-range" min="-2" max="2" step="0.1" value="1" id="rotateSpeedRange">

                            <label for="animSpeedRange" class="form-label small mb-1">Anim Speed: <span id="animSpeedVal">1.2</span></label>
                            <input type="range" class="form-range" min="0.1" max="5" step="0.1" value="1.2" id="animSpeedRange">

                        </div>

                        <div class="col-6">
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="flatShadingSwitch">
                                <label class="form-check-label small" for="flatShadingSwitch">Flat Shading</label>
                            </div>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="doubleSideSwitch">
                                <label class="form-check-label small" for="doubleSideSwitch">Double Sided</label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="vertexColorsSwitch">
                                <label class="form-check-label small" for="vertexColorsSwitch">Vertex Colors</label>
                            </div>

                            <label for="roughnessRange" class="form-label small mb-1">Roughness: <span id="roughnessVal">0.3</span></label>
                            <input type="range" class="form-range" min="0" max="1" step="0.025" value="0.3" id="roughnessRange">

                            <label for="metalnessRange" class="form-label small mb-1">Metalness: <span id="metalnessVal">0.2</span></label>
                            <input type="range" class="form-range" min="0" max="1" step="0.025" value="0.2" id="metalnessRange">

                        </div>
                    </div>

                    <div class="pt-3 mt-2 border-top border-secondary" id="selectModel">

                        <div class="d-flex flex-column mb-2">
                            <small class="text-secondary text-uppercase" style="font-size: 0.65rem; letter-spacing: 0.05rem;">Inspecting scene</small>
                            <span id="selectedModel" class="fw-bold text-info small text-truncate">(none)</span>
                        </div>

                        <div class="d-flex align-items-center gap-3">

                            <div class="btn-group border border-secondary rounded">
                                <button class="btn btn-outline-info btn-sm border-0" id="btnSelectPrevModel" title="Previous mesh">
                                    <i class="bi bi-chevron-left"></i>
                                </button>
                                <div class="vr bg-secondary my-1"></div>
                                <button class="btn btn-outline-info btn-sm border-0" id="btnSelectNextModel" title="Next mesh">
                                    <i class="bi bi-chevron-right"></i>
                                </button>
                            </div>

                            <div class="flex-grow-1 d-flex align-items-center gap-2">
                                <i class="bi bi-circle-half small text-secondary" title="Opacity"></i>
                                <input type="range" class="form-range" id="modelOpacityRange" min="0" max="1" step="0.05" value="1">
                            </div>

                            <div class="form-check form-switch mb-0">
                                <input class="form-check-input" type="checkbox" id="hideSelected">
                                <label class="form-check-label small" for="hideSelected">Hide</label>
                            </div>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div id="progress-container">
        <div class="progress" style="height: 25px;">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" role="progressbar" style="width: 0%">0%</div>
        </div>
    </div>

    <div id="viewer"></div>

    <!-- Start Modal -->
    <div class="modal fade" id="startModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <div class="modal-body text-center p-5">
                    <h1 class="fw-bold mb-3" id="gameTitle"></h1>
                    <p class="lead mb-4" id="gameDescription"></p>
                    <button type="button" id="startBtn" class="btn btn-primary btn-lg px-5">START</button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@latest/examples/jsm/"            }
        }
    </script>

    <script type="module" src="js/app.js?v=1.17"></script>

</body>
</html>
